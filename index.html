<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CambioX — Bolívares, dólares y USDT</title>
<meta name="description" content="Convierte bolívares, dólares BCV y USDT al instante. Funciona sin conexión.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#047857" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#065F46" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CambioX">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- Self-hosted and precached by the service worker: start-up never waits on the network. -->
<link rel="preload" href="fonts/space-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://ve.dolarapi.com" crossorigin>
<link rel="modulepreload" href="core.js">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></symbol>
  <symbol id="i-install" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></symbol>
  <symbol id="i-clear" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17"/></symbol>
  <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.34-5.66M4 4v5h5"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4ZM14 6l4 4"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7 6-7ZM12 9.5l5 5M17 9.5l-5 5"/></symbol>
  <symbol id="i-usdt" viewBox="0 0 24 24"><path d="M6 6h12M12 6v13M7.5 11c1.2.8 2.7 1.2 4.5 1.2s3.3-.4 4.5-1.2"/></symbol>
</svg>

<div class="app">

  <header class="hero">
    <div class="hero__bar">
      <h1 class="brand">
        <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9"/><path d="M11 11l10 10M21 11 11 21"/></svg>
        CambioX
      </h1>
      <div class="hero__actions">
        <button type="button" class="icon-btn" id="install-btn" hidden aria-label="Instalar la app"><svg class="i"><use href="#i-install"/></svg></button>
        <button type="button" class="icon-btn" id="share-btn" aria-label="Compartir conversión"><svg class="i"><use href="#i-share"/></svg></button>
        <button type="button" class="icon-btn" id="refresh-btn" aria-label="Actualizar tasas"><svg class="i"><use href="#i-refresh"/></svg></button>
      </div>
    </div>

    <p class="status" id="status" data-tone="idle">
      <span class="status__dot" aria-hidden="true"></span>
      <span id="status-text">Cargando tasas…</span>
    </p>

    <section class="rates-block" aria-labelledby="rates-title">
      <div class="rates-head">
        <h2 id="rates-title">Tasas <span>· Bs por dólar</span></h2>
        <span class="gap" id="gap" hidden></span>
      </div>

      <div class="rates">
        <div class="rate rate--bcv" data-field="rate:bcv">
          <div class="rate__top">
            <span class="rate__dot" aria-hidden="true"></span>
            <span class="rate__label">BCV</span>
            <span class="rate__edit" aria-hidden="true"><svg class="i"><use href="#i-edit"/></svg></span>
            <button type="button" class="rate__reset" data-reset="bcv" hidden aria-label="Volver a la tasa automática BCV"><svg class="i"><use href="#i-reset"/></svg></button>
          </div>
          <button type="button" class="rate__main" data-activate="rate:bcv">
            <span class="value" data-placeholder="—"></span><span class="caret" aria-hidden="true"></span>
          </button>
          <span class="chip" data-meta="bcv">Automática</span>
        </div>

        <div class="rate rate--usdt" data-field="rate:usdt">
          <div class="rate__top">
            <span class="rate__dot" aria-hidden="true"></span>
            <span class="rate__label">USDT</span>
            <span class="rate__edit" aria-hidden="true"><svg class="i"><use href="#i-edit"/></svg></span>
            <button type="button" class="rate__reset" data-reset="usdt" hidden aria-label="Volver a la tasa automática USDT"><svg class="i"><use href="#i-reset"/></svg></button>
          </div>
          <button type="button" class="rate__main" data-activate="rate:usdt">
            <span class="value" data-placeholder="—"></span><span class="caret" aria-hidden="true"></span>
          </button>
          <span class="chip" data-meta="usdt">Automática</span>
        </div>
      </div>

      <div class="coach" id="rate-hint" role="note" hidden>
        <span>Toca una tasa para usar la tuya</span>
        <button type="button" class="coach__close" aria-label="Entendido"><svg class="i"><use href="#i-clear"/></svg></button>
      </div>
    </section>
  </header>

  <main class="amounts" aria-label="Montos">
    <div class="amount" data-field="bs">
      <button type="button" class="amount__main" data-activate="bs">
        <span class="badge" aria-hidden="true">Bs</span>
        <span class="amount__text">
          <span class="amount__label">Bolívares</span>
          <span class="amount__value"><span class="value" data-placeholder="0,00"></span><span class="caret" aria-hidden="true"></span></span>
        </span>
      </button>
      <button type="button" class="amount__action" data-action-for="bs"><svg class="i"><use href="#i-copy"/></svg></button>
    </div>

    <div class="amount" data-field="bcv">
      <button type="button" class="amount__main" data-activate="bcv">
        <span class="badge badge--bcv" aria-hidden="true">$</span>
        <span class="amount__text">
          <span class="amount__label">Dólares <b>BCV</b></span>
          <span class="amount__value"><span class="value" data-placeholder="0,00"></span><span class="caret" aria-hidden="true"></span></span>
        </span>
      </button>
      <button type="button" class="amount__action" data-action-for="bcv"><svg class="i"><use href="#i-copy"/></svg></button>
    </div>

    <div class="amount" data-field="usdt">
      <button type="button" class="amount__main" data-activate="usdt">
        <span class="badge badge--usdt" aria-hidden="true"><svg class="i"><use href="#i-usdt"/></svg></span>
        <span class="amount__text">
          <span class="amount__label"><b>USDT</b></span>
          <span class="amount__value"><span class="value" data-placeholder="0,00"></span><span class="caret" aria-hidden="true"></span></span>
        </span>
      </button>
      <button type="button" class="amount__action" data-action-for="usdt"><svg class="i"><use href="#i-copy"/></svg></button>
    </div>

    <p class="hint" id="hint">Toca un monto o una tasa y escribe. Fuente: <a href="https://dolarapi.com" target="_blank" rel="noopener">dolarapi.com</a></p>
  </main>

  <div class="keypad" role="group" aria-label="Teclado numérico">
    <button type="button" class="key" data-key="7">7</button>
    <button type="button" class="key" data-key="8">8</button>
    <button type="button" class="key" data-key="9">9</button>
    <button type="button" class="key" data-key="4">4</button>
    <button type="button" class="key" data-key="5">5</button>
    <button type="button" class="key" data-key="6">6</button>
    <button type="button" class="key" data-key="1">1</button>
    <button type="button" class="key" data-key="2">2</button>
    <button type="button" class="key" data-key="3">3</button>
    <button type="button" class="key key--alt" data-key="," aria-label="Coma decimal">,</button>
    <button type="button" class="key" data-key="0">0</button>
    <button type="button" class="key key--alt" data-key="back" aria-label="Borrar (mantén para borrar todo)"><svg class="i"><use href="#i-back"/></svg></button>
  </div>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<p class="sr-only" id="sr-summary" aria-live="polite"></p>

</body>
</html>
